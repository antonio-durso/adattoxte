# Render blueprint per il backend Adatto x Te
# Uso: su https://render.com -> New -> Blueprint -> seleziona questo repo
# Il frontend (Vercel) e il backend (Render) restano separati:
# imposta VITE_API_URL sul frontend = URL di questo servizio.
services:
  - type: web
    name: adattoxte-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: sh -c "npm run seed && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://frontend-lovat-eta-71.vercel.app,https://adattoxte.vercel.app,https://antonio-durso.github.io
      - key: FRONTEND_URL
        value: https://adattoxte.vercel.app
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Imposta a "1" SOLO dopo aver attivato PayPal nella Dashboard Stripe
      # (Impostazioni -> Metodi di pagamento). Disponibile per aziende UE.
      - key: STRIPE_PAYPAL_ENABLED
        sync: false
