# Render blueprint per il backend Adatto x Te
# Uso: su https://render.com -> New -> Blueprint -> seleziona questo repo
# Il frontend (Vercel) e il backend (Render) restano separati:
# imposta VITE_API_URL sul frontend = URL di questo servizio.
services:
  - type: web
    name: adattoxte-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: sh -c "npm run seed && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://frontend-lovat-eta-71.vercel.app,https://adattoxte.vercel.app,https://antonio-durso.github.io
      - key: FRONTEND_URL
        value: https://adattoxte.vercel.app
      - key: TRUSTPILOT_URL
        value: https://it.trustpilot.com/evaluate/adattoxte.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # sandbox (test) oppure live (pagamenti reali)
      - key: PAYPAL_MODE
        value: sandbox
