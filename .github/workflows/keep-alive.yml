# keep-alive — mantiene sveglio il backend Render (free tier dorme dopo ~15 min)
# Ping a /api/health ogni 5 minuti via GitHub Actions (repo pubblico = minuti illimitati).
# Sostituisce UptimeRobot per il wake-up; gli errori restano visibili nei log delle run.
name: keep-alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health (Render)
        run: |
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 25 \
            https://adattoxte-backend.onrender.com/api/health || true)
          echo "HTTP $code"
          cat /tmp/health.json || true
          # Fallisce la run solo se il backend non risponde (visibile nelle run Actions)
          if [ "$code" != "200" ]; then
            echo "⚠️  Backend non raggiungibile (HTTP $code)"
            exit 1
          fi
