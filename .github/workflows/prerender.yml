# prerender-full — genera HTML statico completo (SSG) e fa il deploy su Vercel.
# Perché: il prerender dentro il build Vercel è limitato (12 rotte, sandbox senza Chrome
# affidabile). Qui gira su un runner Ubuntu dove Chrome funziona, poi il deploy è "prebuilt".
# NOTA: su Vercel la modalità FAST è forzata da VERCEL=1; PRERENDER_FAST=0 la disattiva
# (vedi package.json) così il prerender completo copre TUTTE le rotte della sitemap.
name: prerender-full

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_MuI5ShJ9K4G4bcmBkKjogL2x
      VERCEL_PROJECT_ID: prj_f6z7MbIT3J4dvwqCKThOZaykqxXq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze frontend
        working-directory: frontend
        run: npm ci

      - name: Collega progetto Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # vercel build esegue "npm run build" (impostazione progetto Vite):
      # vite build + prerender COMPLETO (PRERENDER_FAST=0) + inline-css + sitemap.
      - name: Build + prerender completo
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: PRERENDER_FAST=0 npx vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy prebuilt su Vercel (produzione)
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
