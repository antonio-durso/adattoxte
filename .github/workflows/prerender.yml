# prerender-full — genera HTML statico completo (SSG, 398 pagine) e fa il deploy
# prebuilt su Vercel. Il prerender completo non entra nei 45 min del build cloud
# Vercel: gira qui su un runner Ubuntu (Chrome + rete affidabili) e il risultato
# viene caricato come deployment "prebuilt" su produzione.
name: prerender-full

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_MuI5ShJ9K4G4bcmBkKjogL2x
      VERCEL_PROJECT_ID: prj_f6z7MbIT3J4dvwqCKThOZaykqxXq
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze frontend
        working-directory: frontend
        run: npm ci

      # PRERENDER_FAST=0 forza il prerender completo anche quando il CLI Vercel
      # imposta VERCEL=1 (vedi package.json). Se il secret VERCEL_TOKEN non è
      # ancora configurato lo step viene saltato senza errori.
      - name: Build SSG + deploy prebuilt su Vercel (produzione)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          PRERENDER_FAST=0 npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Secret VERCEL_TOKEN mancante - deploy saltato
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "::warning::Aggiungi il secret VERCEL_TOKEN (Settings -> Secrets -> Actions) e rilancia il workflow."
