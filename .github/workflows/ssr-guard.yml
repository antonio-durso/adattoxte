name: ssr-guard

on:
  schedule:
    - cron: '0 6 * * *' # ogni giorno alle 06:00 UTC
  workflow_dispatch: {} # avvio manuale dalla UI di GitHub

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sentinella SSR
        run: node .github/scripts/ssr-guard.mjs
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          GUARD_EMAIL_TO: ${{ secrets.GUARD_EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
