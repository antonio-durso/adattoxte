# Render blueprint per il backend Adatto x Te
# Uso: su https://render.com -> New -> Blueprint -> seleziona questo repo
# Il frontend (Vercel) e il backend (Render) restano separati:
# imposta VITE_API_URL sul frontend = URL di questo servizio.
services:
  - type: web
    name: adattoxte-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: sh -c "npm run seed && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://frontend-lovat-eta-71.vercel.app,https://adattoxte.vercel.app,https://adattoxte.com,https://www.adattoxte.com,https://antonio-durso.github.io
      - key: FRONTEND_URL
        value: https://adattoxte.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Email automatiche (Brevo) — SMTP_PASS è segreta: va impostata nel pannello Render
      # (Service -> Environment -> SMTP_PASS), MAI nel codice (repo pubblico)
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: b68801001@smtp-brevo.com
      - key: EMAIL_FROM
        value: noreply@adattoxte.it
      - key: EMAIL_NAME
        value: Adatto x Te
      # SMTP_PASS (chiave Brevo) NON va nel repo: GitHub lo blocca (secret scanning).
      # Impostarla nel pannello Render: Service -> Environment -> SMTP_PASS -> Salva.
