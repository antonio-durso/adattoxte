<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Pagina non trovata | Adatto x Te</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; min-height: 90vh; align-items: center; justify-content: center; background: #f6fafd; margin: 0; color: #22303f; }
    .box { text-align: center; padding: 24px; max-width: 460px; }
    h1 { font-size: 64px; margin: 0 0 6px; color: #48A8D8; }
    p { font-size: 15px; line-height: 1.6; color: #334155; }
    .actions { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a.btn { display: inline-block; background: #48A8D8; color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 999px; font-weight: 700; }
    a.btn.secondary { background: #fff; color: #286a8f; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>La pagina che cerchi non esiste o è stata spostata. Torna alla home, guarda i terapeuti disponibili oppure prova il test di benessere gratuito.</p>
    <div class="actions">
      <a class="btn" href="/">Torna alla home</a>
      <a class="btn secondary" href="/terapeuti">Vedi i terapeuti</a>
      <a class="btn secondary" href="/test">Fai il test gratuito</a>
    </div>
  </div>
</body>
</html>
